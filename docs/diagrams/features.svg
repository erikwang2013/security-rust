      <rect x="268" y="294" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="282" cy="306" r="4.5" fill="#E8710A"/><text x="294" y="310.5">request_smuggling</text>
      <rect x="268" y="321" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="282" cy="333" r="4.5" fill="#F9AB00"/><text x="294" y="337.5">open_redirect</text>
      <rect x="268" y="348" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="282" cy="360" r="4.5" fill="#F9AB00"/><text x="294" y="364.5">cors</text>
      <rect x="268" y="375" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="282" cy="387" r="4.5" fill="#E8710A"/><text x="294" y="391.5">websocket</text>
      <rect x="268" y="402" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="282" cy="414" r="4.5" fill="#E8710A"/><text x="294" y="418.5">dns_rebinding</text>
      <rect x="268" y="429" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="282" cy="441" r="4.5" fill="#B3261E"/><text x="294" y="445.5">log4shell</text>
      <rect x="268" y="456" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="282" cy="468" r="4.5" fill="#F9AB00"/><text x="294" y="472.5">hpp</text>
    </g>
  </g>

  <!-- 列 3：数据 -->
  <g font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">
    <rect x="488" y="118" width="204" height="56" rx="10" fill="#F3EDFE" stroke="#7C3AED"/>
    <text x="502" y="142" font-size="14" font-weight="700" fill="#7C3AED">data</text>
    <text x="678" y="142" font-size="13" fill="#7C3AED" text-anchor="end">7</text>
    <text x="502" y="162" font-size="10.5" fill="#6E5A93" font-family="system-ui, 'Noto Sans CJK SC', sans-serif">序列化 / 公式 / 头部载荷</text>

    <g font-size="11.5" fill="#4A4038">
      <rect x="488" y="186" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="502" cy="198" r="4.5" fill="#B3261E"/><text x="514" y="202.5">deserialization</text>
      <rect x="488" y="213" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="502" cy="225" r="4.5" fill="#F9AB00"/><text x="514" y="229.5">csv_injection</text>
      <rect x="488" y="240" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="502" cy="252" r="4.5" fill="#F9AB00"/><text x="514" y="256.5">mail_header</text>
      <rect x="488" y="267" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="502" cy="279" r="4.5" fill="#E8710A"/><text x="514" y="283.5">jwt_attack</text>
      <rect x="488" y="294" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="502" cy="306" r="4.5" fill="#E8710A"/><text x="514" y="310.5">prototype_pollution</text>
      <rect x="488" y="321" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="502" cy="333" r="4.5" fill="#E8710A"/><text x="514" y="337.5">formula_injection</text>
      <rect x="488" y="348" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="502" cy="360" r="4.5" fill="#F9AB00"/><text x="514" y="364.5">redos</text>
