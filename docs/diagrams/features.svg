  <!-- 有状态模块 -->
  <line x1="48" y1="500" x2="912" y2="500" stroke="#EFE4D8" stroke-width="1.5"/>
  <text x="48" y="528" font-size="14" font-weight="700" fill="#1F1B18">有状态模块</text>
  <text x="200" y="528" font-size="11.5" fill="#7A6A5C">不实现 Detector，不在 Scanner 装配范围内 —— 输入不是单个字符串</text>

  <g>
    <rect x="48" y="544" width="272" height="100" rx="10" fill="#F5F9FA" stroke="#0E7490"/>
    <text x="64" y="572" font-size="13" font-weight="700" fill="#0E7490" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">SessionGuard · session</text>
    <g font-size="11" fill="#5C7276">
      <text x="64" y="594" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace" font-size="10.5">bind · verify · rotate · revoke</text>
      <text x="64" y="614">11 种威胁 → 严重度 → Allow / Challenge / Block</text>
      <text x="64" y="634">存储故障 ⇒ Block（fail-closed，绝不放行）</text>
    </g>
  </g>
  <g>
    <rect x="332" y="544" width="272" height="100" rx="10" fill="#FEF8F0" stroke="#B45309"/>
    <text x="348" y="572" font-size="13" font-weight="700" fill="#B45309" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">Throttle · throttle</text>
    <g font-size="11" fill="#8A6A3A">
      <text x="348" y="594" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">check_any · record_failure</text>
      <text x="348" y="614">滑动窗口计数 → 阈值封禁 → 到期自动解封</text>
      <text x="348" y="634">存储故障 ⇒ Unavailable（fail-open，交调用方）</text>
    </g>
  </g>
  <g>
    <rect x="616" y="544" width="272" height="100" rx="10" fill="#FBF7F2" stroke="#8F2A17"/>
    <text x="632" y="572" font-size="13" font-weight="700" fill="#8F2A17" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">RiskAssessment · score</text>
    <g font-size="11" fill="#7A6A5C">
      <text x="632" y="594" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">assess(&amp;[DetectionResult])</text>
      <text x="632" y="614">总分 = Σ 严重度权重，多条低危可叠加升级</text>
      <text x="632" y="634">None / Low / Medium / High / Critical</text>
    </g>
  </g>

  <!-- 图例 -->
  <text x="48" y="686" font-size="12.5" fill="#7A6A5C">严重度权重</text>
  <g font-size="12" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">
    <circle cx="160" cy="682" r="5" fill="#B3261E"/><text x="174" y="686" fill="#4A4038">Critical 100</text>
    <circle cx="300" cy="682" r="5" fill="#E8710A"/><text x="314" y="686" fill="#4A4038">High 40</text>
    <circle cx="420" cy="682" r="5" fill="#F9AB00"/><text x="434" y="686" fill="#4A4038">Medium 15</text>
    <circle cx="560" cy="682" r="5" fill="#188038"/><text x="574" y="686" fill="#4A4038">Low 5</text>
  </g>
  <text x="48" y="722" font-size="12" fill="#7A6A5C">任一 Critical 直接判 Critical（不靠累加）；其余按总分分档：≥40 High · ≥15 Medium · ≥1 Low · 0 None</text>
  <text x="48" y="744" font-size="12" fill="#7A6A5C">检测器全量扫描不短路 —— 一个输入可能同时触发多种攻击，先到先报会漏报。</text>
</svg>
