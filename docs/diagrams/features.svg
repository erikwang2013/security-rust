  <!-- 列 4：文件 -->
  <g font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace">
    <rect x="708" y="118" width="204" height="56" rx="10" fill="#E8F6F0" stroke="#0E9F6E"/>
    <text x="722" y="142" font-size="14" font-weight="700" fill="#0B7A55">file</text>
