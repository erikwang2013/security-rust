<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 776" width="960" height="776" role="img" aria-labelledby="featTitle featDesc" font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="featTitle">security-rust 功能设计</title>
  <desc id="featDesc">四大类 32 个无状态检测器（注入 11、协议 11、数据 7、文件 3），每个标注严重度；下方为三个有状态模块：会话安全、限流封禁、风险评分。</desc>

  <rect x="0" y="0" width="960" height="776" fill="#FFFDFB"/>
  <rect x="10" y="10" width="940" height="756" rx="20" fill="none" stroke="#EADCCC" stroke-width="2"/>

  <text x="48" y="58" font-size="24" font-weight="700" fill="#1F1B18">security-rust · 功能设计</text>
  <text x="48" y="84" font-size="13.5" fill="#7A6A5C">32 个无状态检测器按四类装配，Scanner::default() 零配置全量启用；三个有状态模块负责字符串扫描够不到的部分</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#EFE4D8" stroke-width="1.5"/>

