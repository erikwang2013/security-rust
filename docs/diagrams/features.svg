      <rect x="48" y="321" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="62" cy="333" r="4.5" fill="#E8710A"/><text x="74" y="337.5">xpath_injection</text>
      <rect x="48" y="348" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="62" cy="360" r="4.5" fill="#B3261E"/><text x="74" y="364.5">jndi_injection</text>
      <rect x="48" y="375" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="62" cy="387" r="4.5" fill="#E8710A"/><text x="74" y="391.5">ssi_injection</text>
      <rect x="48" y="402" width="204" height="24" rx="6" fill="#FFFFFF" stroke="#EADCCC"/><circle cx="62" cy="414" r="4.5" fill="#F9AB00"/><text x="74" y="418.5">graphql_injection</text>
