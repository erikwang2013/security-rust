<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460" role="img" aria-labelledby="petTitle petDesc">
  <title id="petTitle">甲哨 Sentri — security-rust 项目宠物</title>
  <desc id="petDesc">一只举着放大镜与告示牌的哨蟹：32 片甲片对应 32 个检测器，四行甲片对应四大类。只报告，不拦截。</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#E4573C"/>
      <stop offset="1" stop-color="#C43A22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6D9C8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F6D9C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 卡片底 -->
  <rect x="8" y="8" width="464" height="444" rx="28" fill="#FFF8F0" stroke="#EADCCC" stroke-width="2"/>
  <circle cx="240" cy="225" r="180" fill="url(#glow)"/>

  <!-- 地面投影 -->
  <ellipse cx="240" cy="344" rx="122" ry="14" fill="#E9DACB" opacity="0.6"/>

  <!-- 六条腿 -->
  <g stroke="#C43A22" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M158 255 C130 258 112 270 100 286"/>
    <path d="M170 275 C146 282 130 294 120 310"/>
    <path d="M197 292 C180 304 172 318 168 334"/>
    <path d="M322 255 C350 258 368 270 380 286"/>
    <path d="M310 275 C334 282 350 294 360 310"/>
    <path d="M283 292 C300 304 308 318 312 334"/>
  </g>

  <!-- 双臂 -->
  <g stroke="#CE422B" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M162 206 C140 200 122 192 108 182"/>
    <path d="M318 206 C340 200 358 192 372 182"/>
  </g>

  <!-- 身体 -->
  <ellipse cx="240" cy="232" rx="92" ry="68" fill="url(#shell)" stroke="#8F2A17" stroke-width="3"/>
  <ellipse cx="200" cy="196" rx="30" ry="15" fill="#FFFFFF" opacity="0.18" transform="rotate(-25 200 196)"/>

  <!-- 32 片甲：4 行 × 8 片，行 = 四大类 -->
  <g>
    <g fill="#B3261E" opacity="0.9" stroke="#FFF8F0" stroke-width="1.4"><!-- injection: 11 detectors, 8 plates -->
      <circle cx="170" cy="188" r="5"/><circle cx="190" cy="188" r="5"/><circle cx="210" cy="188" r="5"/><circle cx="230" cy="188" r="5"/>
      <circle cx="250" cy="188" r="5"/><circle cx="270" cy="188" r="5"/><circle cx="290" cy="188" r="5"/><circle cx="310" cy="188" r="5"/>
    </g>
    <g fill="#2D5BE3" opacity="0.9" stroke="#FFF8F0" stroke-width="1.4"><!-- protocol: 11 detectors, 8 plates -->
      <circle cx="170" cy="212" r="5"/><circle cx="190" cy="212" r="5"/><circle cx="210" cy="212" r="5"/><circle cx="230" cy="212" r="5"/>
      <circle cx="250" cy="212" r="5"/><circle cx="270" cy="212" r="5"/><circle cx="290" cy="212" r="5"/><circle cx="310" cy="212" r="5"/>
    </g>
    <g fill="#7C3AED" opacity="0.9" stroke="#FFF8F0" stroke-width="1.4"><!-- data: 7 detectors, 8 plates -->
      <circle cx="170" cy="236" r="5"/><circle cx="190" cy="236" r="5"/><circle cx="210" cy="236" r="5"/><circle cx="230" cy="236" r="5"/>
      <circle cx="250" cy="236" r="5"/><circle cx="270" cy="236" r="5"/><circle cx="290" cy="236" r="5"/><circle cx="310" cy="236" r="5"/>
    </g>
    <g fill="#0E9F6E" opacity="0.9" stroke="#FFF8F0" stroke-width="1.4"><!-- file: 3 detectors, 8 plates -->
      <circle cx="170" cy="260" r="5"/><circle cx="190" cy="260" r="5"/><circle cx="210" cy="260" r="5"/><circle cx="230" cy="260" r="5"/>
      <circle cx="250" cy="260" r="5"/><circle cx="270" cy="260" r="5"/><circle cx="290" cy="260" r="5"/><circle cx="310" cy="260" r="5"/>
    </g>
  </g>

  <!-- 嘴：抿着，不喊 -->
  <path d="M224 282 Q240 294 256 282" stroke="#7A2312" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 眼柄与眼 -->
  <g stroke="#CE422B" stroke-width="9" stroke-linecap="round">
    <path d="M210 172 L196 134"/>
    <path d="M270 172 L284 134"/>
  </g>
  <circle cx="194" cy="126" r="16" fill="#FFFFFF" stroke="#8F2A17" stroke-width="3"/>
  <circle cx="286" cy="126" r="16" fill="#FFFFFF" stroke="#8F2A17" stroke-width="3"/>
  <circle cx="196" cy="128" r="8" fill="#1F1B18"/>
  <circle cx="288" cy="128" r="8" fill="#1F1B18"/>
  <circle cx="199" cy="125" r="3" fill="#FFFFFF"/>
  <circle cx="291" cy="125" r="3" fill="#FFFFFF"/>
  <!-- 审计员的单片镜 -->
  <circle cx="286" cy="126" r="23" fill="none" stroke="#D4A017" stroke-width="3"/>
  <path d="M306 142 C316 152 320 162 320 172" stroke="#D4A017" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- 左钳：夹着放大镜的柄 -->
  <g transform="translate(104 180)">
    <ellipse cx="-30" cy="0" rx="30" ry="10" fill="#CE422B" stroke="#8F2A17" stroke-width="3" transform="rotate(-34)"/>
    <ellipse cx="-30" cy="0" rx="30" ry="10" fill="#CE422B" stroke="#8F2A17" stroke-width="3" transform="rotate(26)"/>
    <circle cx="0" cy="0" r="13" fill="#CE422B" stroke="#8F2A17" stroke-width="3"/>
  </g>
  <path d="M62 136 L100 176" stroke="#8F2A17" stroke-width="9" stroke-linecap="round"/>
  <circle cx="44" cy="118" r="26" fill="#CFEAE6" fill-opacity="0.9" stroke="#8F2A17" stroke-width="4"/>
  <path d="M28 108 A20 20 0 0 1 48 98" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- 右钳：举着告示牌 -->
  <g transform="translate(376 180) scale(-1 1)">
    <ellipse cx="-30" cy="0" rx="30" ry="10" fill="#CE422B" stroke="#8F2A17" stroke-width="3" transform="rotate(-34)"/>
    <ellipse cx="-30" cy="0" rx="30" ry="10" fill="#CE422B" stroke="#8F2A17" stroke-width="3" transform="rotate(26)"/>
    <circle cx="0" cy="0" r="13" fill="#CE422B" stroke="#8F2A17" stroke-width="3"/>
  </g>
  <path d="M380 170 L398 134" stroke="#8F2A17" stroke-width="7" stroke-linecap="round"/>
  <rect x="352" y="72" width="104" height="64" rx="12" fill="#FFF6EC" stroke="#8F2A17" stroke-width="3"/>
  <text x="404" y="110" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace" font-size="30" font-weight="700" fill="#B3261E">!</text>
  <text x="404" y="128" text-anchor="middle" font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#7A6A5C">已上报</text>

  <!-- 铭牌 -->
  <text x="36" y="408" font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#1F1B18">甲哨 Sentri</text>
  <text x="36" y="432" font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#7A6A5C">security-rust 项目宠物 · 只报告，不拦截</text>
  <rect x="336" y="388" width="112" height="26" rx="13" fill="#EDF7F1" stroke="#0E9F6E" stroke-width="1.5"/>
  <text x="392" y="405" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'Noto Sans CJK SC', monospace" font-size="12" fill="#0B7A55">deps: regex ×1</text>
</svg>
